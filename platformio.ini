; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html
;
; Every platform and library is pinned to an exact version. Updates are made
; deliberately, one at a time, and noted in CHANGELOG.md.

[platformio]
default_envs = xiao_esp32s3_plus

; Settings shared by all environments.
[env]
build_flags =
    -Wall
    -Wextra
; ArduinoJson 7.4.3 (MIT): streaming JSON parser with filters, used by the
; widgets to read API responses.
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; Reference hardware: Seeed TRMNL 7.5" (OG) DIY Kit
; (XIAO ESP32-S3 Plus + EE04 driver board + 7.5" UC8179 panel).
[env:xiao_esp32s3_plus]
; pioarduino 55.03.313 = Arduino-ESP32 3.3.13 (ESP-IDF 5.5.6). The platform
; release pins the toolchain and framework packages as well. It accepts every
; PlatformIO Core from 6.2.0 on, including 6.2.0.post1, which the VS Code
; extension installs on a new PC (55.03.312-1 refused it).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = seeed_xiao_esp32_s3_plus
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Embeds the settings page (web/) as src/generated/settings_page.h before the
; build; after it writes firmware-full.bin (whole flash image) next to
; firmware.bin.
extra_scripts =
    pre:tools/embed_web.py
    post:tools/full_image.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The widget library is listed explicitly so the firmware build compiles it
; for the device even before src/main.cpp uses it.
lib_deps =
    ${env.lib_deps}
    widgets
; Unit tests run on the host only (see env:native).
test_ignore = *

; Host-side unit tests: pio test -e native
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
lib_deps =
    ${env.lib_deps}
    throwtheswitch/Unity@2.6.1
build_flags =
    ${env.build_flags}
    -std=c++17
    -pthread

; The native tests with AddressSanitizer and UndefinedBehaviorSanitizer (CI
; runs them too). They report memory used after it was freed, writes past an
; array and overflows, which the plain tests do not notice.
[env:native_asan]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=undefined
